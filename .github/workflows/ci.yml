name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run it manually
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true

      # The Claude Agent SDK sidecar is a Node program. Without Node the
      # real-worker tests skip, and CI would silently lose the only check that
      # the embedded worker actually loads under Node - which is the bug class a
      # human probe found once before.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report Node version
        run: node --version

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector enabled)
        run: go test ./... -race -count=1
